  <text x="478.75300000000004" y="335" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Native client event stream chunks</text>
</g>
<g class="message" data-from="GW" data-to="CLI" data-label="Synthesized genuine SSE (thinking_delta + text)" data-line-style="solid" data-arrow-head="filled" data-self="false">
