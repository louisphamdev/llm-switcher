  <polygon points="698.3335,138 704.3335,144 698.3335,144" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="573.8965000000001" y="149.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Repair orphan results, thinking budget &amp; 1M context</text>
