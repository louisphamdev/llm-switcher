# The shims and the blindfold certificates have one code path per platform, and a test for a
# platform skips itself everywhere else. Only a run on each platform proves all of them.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A local run takes about 2 minutes. A hang must fail the job, not hold it for 6 hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          # The lowest version that package.json accepts.
          - os: ubuntu-latest
            node: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
